# Checks pull requests on Ubuntu 24.04 LTS using the distribution's GCC, CMake and SDL2.
# Formatting uses a pinned clang-format from PyPI. Update CLANG_FORMAT_VERSION in both
# CI workflows and clang_format_version in Kinetra's tools/cloud_setup.sh together.
# Package installation uses the Azure mirror with a bounded fallback to the image's sources.
# Keep the workflow name "CI" and required status job "checks" stable.
# The separate Lab pointer workflow follows main after a merge.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.5"

jobs:
  # Decides whether a pull request can change the build or the tests: not when it changes
  # only Markdown, docs/ or .agents/. Then "linux" is skipped, only the docs check runs
  # here, and "checks" follows its result. A missing merge base or failed decision sends
  # the pull request through "linux", including its documentation check.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      skip_build: ${{ steps.decide.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The decision needs commits and trees, not the contents of old files.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether build and tests are needed
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # An early exit leaves skip_build empty, which the jobs below read as a full run.
          git cat-file -e "$HEAD" 2>/dev/null || git fetch -q origin "$HEAD" || true
          if ! mb=$(git merge-base "$BASE" "$HEAD" 2>/dev/null); then
            echo "::warning title=No merge base::Could not find the merge base of $BASE and $HEAD; the full CI runs."
            exit 0
          fi
          # --no-renames: a rename lists its old and its new path, so a source moved into
          # docs/ or renamed to .md still counts as a source change.
          files=$(git diff --no-renames --name-only "$mb" "$HEAD")
          printf 'Changed in this pull request:\n%s\n' "${files:-(nothing)}"
          # Status 0: some line needs a build; 1: none does; anything else is doubt. The
          # self-check below and the decision call the same function, so the self-check also
          # tests the command that decides. Here-strings, so no SIGPIPE can read as "none".
          docs='(\.md$|^docs/|^\.agents/|^$)'
          needs_build() { grep -q -v -E -e "$docs" <<< "$1"; }
          # This run uses the pull request's own copy of the filter. A broken pattern or
          # decision must not skip builds, so it first has to keep every one of these paths.
          for path in CMakeLists.txt cmake/x.cmake include/kinetra/x.h src/x.cpp tests/x.cpp .github/workflows/ci.yml tools/x.py; do
            if ! needs_build "$path"; then
              echo "::warning title=Filter check failed::The docs filter would skip $path; the full CI runs."
              exit 0
            fi
          done
          # Skip only when no line needs a build (status 1): the decision fails closed.
          skip=false
          status=0
          needs_build "$files" || status=$?
          if [ "$status" -eq 1 ]; then
            skip=true
            echo "::notice title=Build and tests skipped::Only Markdown, docs/ or .agents/ changed: only the docs check runs."
          fi
          echo "skip_build=$skip" >> "$GITHUB_OUTPUT"

      - name: Documentation links (no build needed)
        if: steps.decide.outputs.skip_build == 'true'
        run: python3 tools/check_docs.py

  linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    runs-on: ubuntu-24.04
    # A run takes about two minutes; the limit leaves room for an install step that runs
    # out its 15 minutes and for a slow runner.
    timeout-minutes: 45
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Ubuntu's packages
        # About half a minute from the mirror. archive.ubuntu.com, the image's source, once
        # served a run so slowly that this step was still downloading after an hour.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The Debian and Ubuntu package set of docs/development.md, which tools/cloud_setup.sh
          # installs in a cloud session too. Git is for checkout and venv for clang-format.
          packages="build-essential cmake ninja-build ccache libsdl2-dev libgl-dev libegl-dev libgl1-mesa-dri libegl-mesa0 git ca-certificates python3-venv"
          # Canonical's mirror inside Azure, where the runners run, serves the same archive.
          # The copy of the image's sources stays outside sources.list.d, where apt would
          # report its extension.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          cp "$sources" /etc/apt/ubuntu.sources.image
          sed -i -E 's#^URIs: http://(archive|security)\.ubuntu\.com/ubuntu/?$#URIs: http://azure.archive.ubuntu.com/ubuntu/#' "$sources"
          grep '^URIs:' "$sources"
          # The pattern matches the URIs of today's image; one it misses, say a later image's
          # https://, would otherwise go unnoticed.
          if grep -q -v -x 'URIs: http://azure\.archive\.ubuntu\.com/ubuntu/' <<< "$(grep '^URIs:' "$sources")"; then
            echo "::warning title=Ubuntu mirror not used::A URI of the image's ubuntu.sources does not match this step's pattern, so this run installs from that source instead of the Azure mirror."
          fi
          apt_install() { apt-get install -y --no-install-recommends $packages; }
          # The mirror gets 90 seconds of the step's 15 minutes to deliver the indexes and the
          # packages, which took about ten seconds in the runs measured on 2026-11-26; a stalled
          # download then costs a run two minutes, not five and a half. A mirror that does not
          # answer, or stalls a download, would otherwise spend the 15 minutes on apt's timeouts
          # and retries, and the fallback would never start. timeout bounds only the update and
          # --download-only, which run no dpkg; the install from the downloaded packages has no
          # budget, because a killed apt-get install can leave dpkg half-configured. timeout
          # runs a program, not a shell function: hence bash -c and the exported list. apt-get
          # update succeeds when an index fails to download; Error-Mode=any makes the mirror's
          # update fail then, so a run never installs from a partial package list.
          export packages
          if ! { timeout -k 10 90 bash -c 'apt-get update -o APT::Update::Error-Mode=any && apt-get install -y --no-install-recommends --download-only $packages' && apt_install; }; then
            echo "::warning title=Ubuntu mirror not used::The Azure mirror of the Ubuntu archive failed or did not deliver the indexes and packages within 90 seconds, so this run installs from the image's own sources."
            cp /etc/apt/ubuntu.sources.image "$sources"
            apt-get update
            apt_install
          fi

      - name: Tool versions
        run: |
          # sed reads all of its input: with head, the writer can die of SIGPIPE, and the
          # step shell's pipefail turns that into a failure (exit code 141).
          command -v gcc cmake ctest ninja
          gcc --version | sed -n 1p; cmake --version | sed -n 1p; ninja --version; ldd --version | sed -n 1p

      - uses: actions/checkout@v7

      - name: Trust the workspace in the container
        run: git config --global --add safe.directory '*'

      - name: Install pinned clang-format
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/python" -m pip install --only-binary=:all: "clang-format==$CLANG_FORMAT_VERSION"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Format check (clang-format)
        run: |
          clang-format --version
          git ls-files -- '*.h' '*.cpp' ':(exclude)include/glad/**' ':(exclude)include/KHR/**' ':(exclude)third_party/**' \
            | xargs clang-format --dry-run --Werror

      - name: Documentation links
        run: python3 tools/check_docs.py

      - name: Icon files match their generator
        run: python3 tools/make_icon.py --check

      - name: Headless build and test (no SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (runtime, warnings as errors, graphics tests with software OpenGL)
        run: cmake --workflow --preset ci

      - name: External consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DKINETRA_SOURCE="$PWD" -DCONSUMER_GRAPHICS=ON
          cmake --build build-consumer
          ./build-consumer/consumer

  # The required status. It passes when "linux" passed, or when
  # "changes" decided that a docs-only pull request needs no build and ran the docs check
  # itself. Any other outcome, a failed or cancelled "linux" run included, fails it.
  checks:
    needs: [changes, linux]
    # always(), not !cancelled(): a skipped required job counts as passed, so on a
    # cancelled run this job must still run and fail.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Linux passed or the documentation check passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SKIP: ${{ needs.changes.outputs.skip_build }}
          LINUX: ${{ needs.linux.result }}
        run: |
          echo "changes: $CHANGES, skip_build: $SKIP, linux: $LINUX"
          if [ "$CHANGES" = success ] && [ "$SKIP" = true ] && [ "$LINUX" = skipped ]; then
            exit 0
          fi
          test "$LINUX" = success
