# Checks every pull request and every push to main. See docs/testing.md#continuous-integration.
#
# One job, "linux", builds and tests on several distributions, each in its own container:
#
# - arch: the reference. The toolchain is pinned: a dated Arch Linux image plus the Arch
#   Linux Archive snapshot below, so compiler warnings (-Werror) and clang-format output
#   cannot change without a commit. When the archive does not answer, the run falls back
#   to the current Arch packages and marks itself with a warning, because it is not
#   pinned. The snapshot matches the Artix/Arch development environment (gcc 16.2.1,
#   clang/clang-format 23.1.5, CMake 4.5.0). Bump both deliberately, in their own commit,
#   and fix what the new toolchain reports. Formatting, the docs check and the icon check
#   run only here, and warnings are errors only here.
# - ubuntu: Ubuntu LTS with its own GCC, glibc, CMake and SDL2, the Debian and Ubuntu
#   package set of docs/development.md#dependencies-and-options. Warnings are annotations,
#   not errors, because another GCC warns about other things. The image tag follows
#   Ubuntu's point releases; its packages are not pinned.
#
# The `ci` test preset runs every test, the graphics cases included: SDL's offscreen
# driver with software Mesa (llvmpipe) gives them an OpenGL context without a GPU or
# display, the same backend as the local `graphics` preset.
#
# The workflow name "CI" and the job id "checks" are the required status check on main;
# keep them stable. "checks" passes when every "linux" run passed, so every distribution in
# the matrix is required, or when "changes" skipped the build of a docs-only pull request.
# Add a distribution as one more matrix entry.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_SNAPSHOT: "2026/11/17"

jobs:
  # Decides whether a pull request can change the build or the tests: not when it changes
  # only Markdown, docs/ or .agents/. Then "linux" is skipped, only the docs check runs
  # here, and "checks" passes on this job's result. A push to main always builds. Any
  # doubt, such as a missing merge base, means a full run, and so does a failure of this
  # job: "linux" then runs, and its docs check fails "checks" as well.
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.decide.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The decision needs commits and trees, not the contents of old files.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether build and tests are needed
        id: decide
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # An early exit leaves skip_build empty, which the jobs below read as a full run.
          git cat-file -e "$HEAD" 2>/dev/null || git fetch -q origin "$HEAD" || true
          if ! mb=$(git merge-base "$BASE" "$HEAD" 2>/dev/null); then
            echo "::warning title=No merge base::Could not find the merge base of $BASE and $HEAD; the full CI runs."
            exit 0
          fi
          # --no-renames: a rename lists its old and its new path, so a source moved into
          # docs/ or renamed to .md still counts as a source change.
          files=$(git diff --no-renames --name-only "$mb" "$HEAD")
          printf 'Changed in this pull request:\n%s\n' "${files:-(nothing)}"
          skip=false
          if ! printf '%s\n' "$files" | grep -v -E '(\.md$|^docs/|^\.agents/)' | grep -q .; then
            skip=true
            echo "::notice title=Build and tests skipped::Only Markdown, docs/ or .agents/ changed: only the docs check runs."
          fi
          echo "skip_build=$skip" >> "$GITHUB_OUTPUT"

      - name: Documentation links (no build needed)
        if: steps.decide.outputs.skip_build == 'true'
        run: python3 tools/check_docs.py

  linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip_build != 'true') }}
    name: linux (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:base-devel-20261108.0.623074
          - distro: ubuntu
            image: ubuntu:24.04
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the pinned Arch toolchain and dependencies
        if: matrix.distro == 'arch'
        run: |
          # The pinned snapshot comes from the Arch Linux Archive. When the archive does not
          # answer, the image's own mirrors serve the current packages instead; such a run is
          # not pinned, so it says so in a warning, and the versions below show what it got.
          packages="git python cmake ninja ccache clang sdl2-compat libglvnd mesa"
          cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.image
          echo "Server = https://archive.archlinux.org/repos/${ARCH_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          if ! pacman -Syyuu --noconfirm --needed $packages; then
            echo "::warning title=Toolchain not pinned::The Arch Linux Archive did not answer, so this run uses the current Arch packages instead of snapshot ${ARCH_SNAPSHOT}."
            cp /etc/pacman.d/mirrorlist.image /etc/pacman.d/mirrorlist
            pacman -Syyuu --noconfirm --needed $packages
          fi

      - name: Install Ubuntu's packages
        if: matrix.distro == 'ubuntu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The Debian and Ubuntu package set of docs/development.md, plus git for the checkout.
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache \
            libsdl2-dev libgl-dev libegl-dev libgl1-mesa-dri libegl-mesa0 git ca-certificates

      - name: Tool versions
        run: |
          # sed reads all of its input: with head, the writer can die of SIGPIPE, and the
          # step shell's pipefail turns that into a failure (exit code 141).
          command -v gcc cmake ctest ninja
          gcc --version | sed -n 1p; cmake --version | sed -n 1p; ninja --version; ldd --version | sed -n 1p

      - uses: actions/checkout@v7

      - name: Trust the workspace in the container
        run: git config --global --add safe.directory '*'

      - name: Format check (clang-format)
        if: matrix.distro == 'arch'
        run: |
          clang-format --version
          git ls-files -- '*.h' '*.cpp' ':(exclude)include/glad/**' ':(exclude)include/KHR/**' ':(exclude)third_party/**' \
            | xargs clang-format --dry-run --Werror

      - name: Documentation links
        if: matrix.distro == 'arch'
        run: python3 tools/check_docs.py

      - name: Icon files match their generator
        if: matrix.distro == 'arch'
        run: python3 tools/make_icon.py --check

      - name: Headless build and test (no SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (runtime, warnings as errors, graphics tests with software OpenGL)
        if: matrix.distro == 'arch'
        run: cmake --workflow --preset ci

      - name: Full build and test (runtime, warnings as annotations, graphics tests with software OpenGL)
        if: matrix.distro != 'arch'
        run: |
          cmake --preset ci -DKINETRA_WARNINGS_AS_ERRORS=OFF
          cmake --build --preset ci 2>&1 | tee build-ci.log
          grep -E 'warning: ' build-ci.log | sort -u \
            | sed "s/^/::warning title=Compiler warning on ${{ matrix.distro }}::/" || true
          ctest --preset ci

      - name: External consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DKINETRA_SOURCE="$PWD" -DCONSUMER_GRAPHICS=ON
          cmake --build build-consumer
          ./build-consumer/consumer

  # The required status. It passes when every distribution of "linux" passed, or when
  # "changes" decided that a docs-only pull request needs no build and ran the docs check
  # itself. Any other outcome, a failed or cancelled "linux" run included, fails it.
  checks:
    needs: [changes, linux]
    # always(), not !cancelled(): a skipped required job counts as passed, so on a
    # cancelled run this job must still run and fail.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every Linux run passed, or the build was rightly skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          SKIP: ${{ needs.changes.outputs.skip_build }}
          LINUX: ${{ needs.linux.result }}
        run: |
          echo "changes: $CHANGES, skip_build: $SKIP, linux: $LINUX"
          if [ "$CHANGES" = success ] && [ "$SKIP" = true ] && [ "$LINUX" = skipped ]; then
            exit 0
          fi
          test "$LINUX" = success
