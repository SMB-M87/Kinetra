# Checks every pull request and every push to main. The job runs in an Arch Linux
# container so compiler, CMake and clang-format match the Artix/Arch development
# environment. Graphics tests are compiled but not run (no GPU); run them locally
# with `cmake --workflow --preset graphics`. See docs/testing.md#continuous-integration.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and dependencies
        run: pacman -Syu --noconfirm --needed git python cmake ninja clang sdl2-compat libglvnd mesa

      - uses: actions/checkout@v4

      - name: Format check (clang-format)
        run: |
          clang-format --version
          git ls-files -- '*.h' '*.cpp' ':(exclude)include/glad/**' ':(exclude)include/KHR/**' ':(exclude)third_party/**' \
            | xargs clang-format --dry-run --Werror

      - name: Documentation links
        run: python3 tools/check_docs.py

      - name: Build and test (warnings as errors)
        run: cmake --workflow --preset ci

      - name: External consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DKINETRA_SOURCE="$PWD" -DCONSUMER_GRAPHICS=ON
          cmake --build build-consumer
          ./build-consumer/consumer
