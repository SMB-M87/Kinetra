# Checks every pull request and every push to main. See docs/testing.md#continuous-integration.
#
# The toolchain is pinned: a dated Arch Linux image plus the Arch Linux Archive
# snapshot below, so compiler warnings (-Werror) and clang-format output cannot
# change without a commit. When the archive does not answer, CI falls back to the
# current Arch packages and marks the run with a warning, because it is not pinned.
# The snapshot matches the Artix/Arch development environment (gcc 16.2.1,
# clang/clang-format 23.1.5, CMake 4.5.0). Bump both deliberately, in their own
# commit, and fix what the new toolchain reports.
#
# The `ci` test preset runs every test, the graphics cases included: SDL's offscreen
# driver with software Mesa (llvmpipe) gives them an OpenGL context without a GPU or
# display, the same backend as the local `graphics` preset. The workflow name "CI" and
# job id "checks" are required status checks on main; keep them stable.
#
# The "ubuntu" job builds and tests on Ubuntu LTS with its own GCC and packages, so Linux
# beyond Arch stays supported (docs/development.md#dependencies-and-options). The pinned Arch
# job stays the reference: formatting and the docs checks run only there, and warnings are
# errors only there, because another GCC warns about other things. Ubuntu's packages are
# not pinned; the job follows the runner image.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_SNAPSHOT: "2026/11/17"

jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:base-devel-20261108.0.623074
    steps:
      - name: Install pinned toolchain and dependencies
        run: |
          # The pinned snapshot comes from the Arch Linux Archive. When the archive does not
          # answer, the image's own mirrors serve the current packages instead; such a run is
          # not pinned, so it says so in a warning, and the versions below show what it got.
          packages="git python cmake ninja ccache clang sdl2-compat libglvnd mesa"
          cp /etc/pacman.d/mirrorlist /etc/pacman.d/mirrorlist.image
          echo "Server = https://archive.archlinux.org/repos/${ARCH_SNAPSHOT}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          if ! pacman -Syyuu --noconfirm --needed $packages; then
            echo "::warning title=Toolchain not pinned::The Arch Linux Archive did not answer, so this run uses the current Arch packages instead of snapshot ${ARCH_SNAPSHOT}."
            cp /etc/pacman.d/mirrorlist.image /etc/pacman.d/mirrorlist
            pacman -Syyuu --noconfirm --needed $packages
          fi
          gcc --version | head -1; clang-format --version; cmake --version | head -1

      - uses: actions/checkout@v7

      - name: Trust the workspace in the container
        run: git config --global --add safe.directory '*'

      - name: Format check (clang-format)
        run: |
          git ls-files -- '*.h' '*.cpp' ':(exclude)include/glad/**' ':(exclude)include/KHR/**' ':(exclude)third_party/**' \
            | xargs clang-format --dry-run --Werror

      - name: Documentation links
        run: python3 tools/check_docs.py

      - name: Icon files match their generator
        run: python3 tools/make_icon.py --check

      - name: Headless build and test (no SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (runtime, warnings as errors, graphics tests with software OpenGL)
        run: cmake --workflow --preset ci

      - name: External consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DKINETRA_SOURCE="$PWD" -DCONSUMER_GRAPHICS=ON
          cmake --build build-consumer
          ./build-consumer/consumer

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          # The Debian and Ubuntu package set of docs/development.md.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache \
            libsdl2-dev libgl-dev libegl-dev libgl1-mesa-dri libegl-mesa0
          gcc --version | head -1; cmake --version | head -1; ldd --version | head -1

      - uses: actions/checkout@v7

      - name: Headless build and test (no SDL2/OpenGL)
        run: cmake --workflow --preset headless

      - name: Full build and test (runtime, warnings reported, graphics tests with software OpenGL)
        run: |
          cmake --preset ci -DKINETRA_WARNINGS_AS_ERRORS=OFF
          cmake --build --preset ci
          ctest --preset ci

      - name: External consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DKINETRA_SOURCE="$PWD" -DCONSUMER_GRAPHICS=ON
          cmake --build build-consumer
          ./build-consumer/consumer
